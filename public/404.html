<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>حقك | Civic Communication Platform</title>
    <script>
      // SPA redirect for GitHub Pages — converts deep-link paths into
      // query strings so index.html can restore them via history.replaceState.
      // Reference: https://github.com/rafgraph/spa-github-pages
      //
      // pathSegmentsToKeep = 0 because we use a custom domain (haqak.org),
      // so there is no repository-name prefix to preserve.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
