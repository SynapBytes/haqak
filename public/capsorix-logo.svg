<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 300" preserveAspectRatio="xMidYMid meet">
  <!-- Define gradient for the logo -->
  <defs>
    <linearGradient id="capsorixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a76a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8c547;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c99a4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- C Logo with gradient -->
  <g transform="translate(60, 150)">
    <!-- Outer C circle arc -->
    <path d="M 80 0 A 80 80 0 0 1 80 160" 
          fill="none" 
          stroke="url(#capsorixGradient)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <!-- Inner decoration arc (nested arc for depth) -->
    <path d="M 50 15 A 65 65 0 0 1 50 145" 
          fill="none" 
          stroke="url(#capsorixGradient)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>
  </g>
  
  <!-- CAPSORIX Text -->
  <g>
    <text x="320" y="220" font-family="'Arial', 'Helvetica', sans-serif" font-size="140" font-weight="300" letter-spacing="8" fill="url(#capsorixGradient)">CAPSORIX</text>
  </g>
</svg>
