    <!-- SPA path restore for GitHub Pages: decodes the ?/ redirect set by 404.html -->
    <!-- Reference: https://github.com/rafgraph/spa-github-pages -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(
            null, null,
            (l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <style>
      #haqak-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.8s ease-in-out;
      }
      .splash-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      .splash-asset {
        position: absolute;
        max-width: 280px;
        width: 70%;
        height: auto;
        opacity: 0;
        transform: scale(0.95);
        filter: blur(10px);
        transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .splash-asset.active {
        opacity: 1;
        transform: scale(1);
        filter: blur(0px);
      }
      .splash-asset.fade-out {
        opacity: 0;
        transform: scale(1.05);
        filter: blur(10px);
      }
      .splash-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(255, 80, 0, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
