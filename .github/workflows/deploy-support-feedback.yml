name: Deploy Haqak Support Feedback

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/support-feedback/**"
      - "supabase/functions/shared/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/deploy-support-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-support-feedback-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy support-feedback
    runs-on: ubuntu-latest

    steps:
      - name: Validate required deployment secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_ID" ] || missing+=("SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secret(s): ${missing[*]}"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "wfuofurgkswotwuzosdd" ]; then
            echo "::error::SUPABASE_PROJECT_ID does not match the documented Haqak production project."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify function sources
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/support-feedback/index.ts
          test -f supabase/functions/shared/cors.ts
          test -f supabase/functions/shared/rate-limiter.ts
          test -f supabase/functions/_shared/secrets.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: 2.84.2

      - name: Deploy public support function
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          supabase functions deploy support-feedback \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Confirm deployment and CORS preflight
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
          FUNCTION_URL="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/support-feedback"
          STATUS=$(curl -sS -o /tmp/support-preflight.txt -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://haqak.org" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,apikey,authorization" \
            "$FUNCTION_URL")
          cat /tmp/support-preflight.txt
          if [ "$STATUS" != "200" ]; then
            echo "::error::support-feedback preflight returned HTTP $STATUS instead of 200."
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          {
            echo "## Haqak support-feedback deployment"
            echo ""
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Function: \`support-feedback\`"
            echo "- JWT gateway verification: disabled intentionally for the public form"
            echo "- Custom controls: exact-origin CORS, strict validation, honeypot, hashed-IP throttling, idempotency"
            echo "- Full delivery smoke test: must be completed using the operations runbook"
          } >> "$GITHUB_STEP_SUMMARY"
