name: Deploy Haqak Support Feedback

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/support-feedback/**"
      - "supabase/functions/support-feedback-worker/**"
      - ".github/workflows/deploy-support-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-haqak-support-feedback-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy support service
    runs-on: ubuntu-latest

    steps:
      - name: Validate isolated deployment credentials
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.HAQAK_SUPPORT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.HAQAK_SUPPORT_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing+=("HAQAK_SUPPORT_SUPABASE_ACCESS_TOKEN")
          [ -n "$SUPABASE_PROJECT_ID" ] || missing+=("HAQAK_SUPPORT_SUPABASE_PROJECT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secret(s): ${missing[*]}"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" != "fpkffdfattidugsrjzey" ]; then
            echo "::error::Refusing deployment: project ID is not the isolated haqak-production project."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify standalone function sources
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/support-feedback/index.ts
          test -f supabase/functions/support-feedback-worker/index.ts
          for file in \
            supabase/functions/support-feedback/index.ts \
            supabase/functions/support-feedback-worker/index.ts
          do
            if grep -qE 'from "\.\./(shared|_shared)/' "$file"; then
              echo "::error::$file must remain standalone from the legacy Haqak Supabase project."
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51
        with:
          version: 2.84.2

      - name: Deploy support functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.HAQAK_SUPPORT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.HAQAK_SUPPORT_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          supabase functions deploy support-feedback \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt
          supabase functions deploy support-feedback-worker \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt

      - name: Confirm deployment and exact-origin CORS
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.HAQAK_SUPPORT_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.HAQAK_SUPPORT_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          FUNCTIONS=$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID")
          printf '%s\n' "$FUNCTIONS"
          grep -q "support-feedback" <<<"$FUNCTIONS"
          grep -q "support-feedback-worker" <<<"$FUNCTIONS"

          FUNCTION_URL="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/support-feedback"
          STATUS=$(curl -sS -o /tmp/support-preflight.txt -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://haqak.org" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,apikey,authorization" \
            "$FUNCTION_URL")
          cat /tmp/support-preflight.txt
          if [ "$STATUS" != "200" ]; then
            echo "::error::support-feedback preflight returned HTTP $STATUS instead of 200."
            exit 1
          fi

      - name: Deployment summary
        shell: bash
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.HAQAK_SUPPORT_SUPABASE_PROJECT_ID }}
        run: |
          {
            echo "## Haqak isolated support service deployment"
            echo ""
            echo "- Project: \`$SUPABASE_PROJECT_ID\`"
            echo "- Functions: \`support-feedback\`, \`support-feedback-worker\`"
            echo "- JWT gateway verification: disabled intentionally; each endpoint has custom controls"
            echo "- Public database access: none"
            echo "- Delivery feature flag: controlled inside the service-only runtime configuration"
            echo "- Full email smoke test: required only after the recipient mailbox is restored"
          } >> "$GITHUB_STEP_SUMMARY"
