name: Secret Strength Audit

# Checks that no placeholder / weak secret values have been committed to the
# repository.  Runs on every push to main and on pull requests, so weak secrets
# are caught before they reach production.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Weekly reminder — every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-audit:
    name: Audit for committed placeholder secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for placeholder secrets in .env.example files
        shell: bash
        run: |
          set -euo pipefail

          PLACEHOLDER_PATTERN='your_[a-z_]+|change.me|todo|placeholder|test.secret|example.secret'

          # Scan .env.example files only — real .env files must never be committed
          FILES=$(find . -name ".env.example" -not -path "./.git/*")

          FOUND=0
          for f in $FILES; do
            # Grep for lines that look like actual assignments (not comments) with
            # placeholder values.  We deliberately exclude comment lines (#).
            if grep -iEv '^\s*#' "$f" | grep -qiE "=($PLACEHOLDER_PATTERN)$"; then
              echo "::notice file=$f::$f contains placeholder values — this is expected for example files."
            fi
          done

          echo "✅ Placeholder check complete (example files are expected to contain placeholders)."

      - name: Detect weak secrets accidentally committed to non-example env files
        shell: bash
        run: |
          set -euo pipefail

          WEAK_PATTERN='(secret|hmac|key|token|password)\s*=\s*(your_|change.me|todo|placeholder|test.secret|example|12345|password|secret$)'

          # Only flag non-example .env files if they exist
          REAL_ENV_FILES=$(find . \( -name ".env" -o -name ".env.local" -o -name ".env.production" \) \
            -not -path "./.git/*" 2>/dev/null || true)

          if [ -z "$REAL_ENV_FILES" ]; then
            echo "✅ No real .env files found in repository (expected — they should be in .gitignore)."
            exit 0
          fi

          FOUND=0
          for f in $REAL_ENV_FILES; do
            if grep -iEv '^\s*#' "$f" | grep -qiE "$WEAK_PATTERN"; then
              echo "::error file=$f::Weak or placeholder secret value detected in $f"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "ACTION REQUIRED:"
            echo "  • Remove or replace the weak secret values listed above."
            echo "  • Generate strong secrets with: openssl rand -hex 32"
            echo "  • Add real .env files to .gitignore so they are never committed."
            echo "  • See docs/SECURITY_SECRET_ROTATION.md for rotation procedures."
            exit 1
          fi

          echo "✅ No weak secrets found in committed env files."

      - name: Check that .env and .env.local are in .gitignore
        shell: bash
        run: |
          set -euo pipefail

          MISSING=()
          for pattern in ".env" ".env.local" ".env.production" ".env.staging"; do
            if ! grep -qF "$pattern" .gitignore 2>/dev/null; then
              MISSING+=("$pattern")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::The following patterns are missing from .gitignore: ${MISSING[*]}"
            echo "Add them to prevent accidental secret commits."
          else
            echo "✅ .gitignore correctly excludes real .env files."
          fi

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## 🔒 Secret Strength Audit"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Placeholder detection in .env files | ✅ Passed |"
            echo "| .gitignore coverage | ✅ Passed |"
            echo ""
            echo "For secret rotation procedures, see [docs/SECURITY_SECRET_ROTATION.md](docs/SECURITY_SECRET_ROTATION.md)."
          } >> "$GITHUB_STEP_SUMMARY"
