name: Security - ZAP DAST

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

env:
  ZAP_FAIL_RISKS: High
  ZAP_PRODUCTION_URL: https://haqak.vercel.app
  # Optional explicit target override for DAST scans.
  DAST_TARGET_URL: ""
  # Optional PR preview URL from deployment workflow/integration.
  VERCEL_PREVIEW_URL: ""

jobs:
  zap-dast:
    name: OWASP ZAP baseline DAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve DAST target URL
        id: target
        shell: bash
        run: |
          set -euo pipefail

          normalize_url() {
            local url="$1"
            if [[ "${url}" =~ ^https?:// ]]; then
              printf '%s\n' "${url}"
            else
              printf 'https://%s\n' "${url}"
            fi
          }

          if [[ -n "${DAST_TARGET_URL:-}" ]]; then
            TARGET_URL="$(normalize_url "${DAST_TARGET_URL}")"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${VERCEL_PREVIEW_URL:-}" ]]; then
            TARGET_URL="$(normalize_url "${VERCEL_PREVIEW_URL}")"
          else
            TARGET_URL="$(normalize_url "${ZAP_PRODUCTION_URL}")"
          fi

          echo "target_url=${TARGET_URL}" >> "${GITHUB_OUTPUT}"

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ steps.target.outputs.target_url }}
          cmd_options: >-
            -m 5
            -a
            -j
            -I
          allow_issue_writing: false

      - name: Enforce ZAP risk threshold
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f report_json.json ]]; then
            echo "ZAP JSON report not found."
            exit 1
          fi
          mapfile -t FAIL_RISKS < <(echo "${ZAP_FAIL_RISKS}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          MATCHES=0
          while IFS= read -r RISK; do
            LEVEL="${RISK%% *}"
            for FAIL_RISK in "${FAIL_RISKS[@]}"; do
              if [[ "${LEVEL,,}" == "${FAIL_RISK,,}" ]]; then
                MATCHES=$((MATCHES + 1))
                break
              fi
            done
          done < <(jq -r '.site[]?.alerts[]?.riskdesc // empty' report_json.json)
          echo "Matched ZAP findings at configured fail risks (${ZAP_FAIL_RISKS}): ${MATCHES}"
          if [[ "${MATCHES}" -gt 0 ]]; then
            exit 1
          fi

      - name: Upload ZAP report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 14
