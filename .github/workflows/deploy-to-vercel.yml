name: Deploy to Vercel

# Deploys the frontend to Vercel Production on every push to main and on
# manual dispatch.  The workflow builds the app first; if the build fails the
# deploy step is never reached, so only a known-good artefact is promoted.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN      — Vercel personal access token (https://vercel.com/account/tokens)
#   VERCEL_ORG_ID     — Vercel team/org ID (found in Vercel team Settings → General)
#   VERCEL_PROJECT_ID — Vercel project ID (found in project Settings → General)
#
# One-time setup:
#   1. Visit https://vercel.com/account/tokens → "Create Token"
#      Name: haqak-deploy   Scope: Full Account   Expiration: choose as needed
#   2. Copy the token value (it is shown only once)
#   3. In GitHub: Settings → Secrets and variables → Actions → New repository secret
#      Add all three secrets listed above.
#   4. After the secrets are set, push to main (or run this workflow manually via
#      Actions → Deploy to Vercel → Run workflow) to trigger the first deploy.
#
# The workflow uses Node.js version from .nvmrc and the Vercel CLI to deploy.
# Build output directory: dist   Build command: npm run build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          MISSING=""
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            MISSING="${MISSING} VERCEL_TOKEN"
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            MISSING="${MISSING} VERCEL_ORG_ID"
          fi
          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            MISSING="${MISSING} VERCEL_PROJECT_ID"
          fi
          if [ -n "${MISSING}" ]; then
            echo "::error::Missing required GitHub secret(s):${MISSING}"
            echo ""
            echo "Setup instructions:"
            echo "  1. Visit https://vercel.com/account/tokens → Create Token"
            echo "     Name: haqak-deploy   Scope: Full Account"
            echo "  2. Copy the token (shown only once)"
            echo "  3. In GitHub: Settings → Secrets and variables → Actions"
            echo "     → New repository secret — add all three secrets:"
            echo "     VERCEL_TOKEN      = <token from step 2>"
            echo "     VERCEL_ORG_ID     = <team/org ID from Vercel team Settings → General>"
            echo "     VERCEL_PROJECT_ID = <project ID from Vercel project Settings → General>"
            echo "  4. Re-run this workflow from the Actions tab."
            exit 1
          fi
          echo "✅ All required Vercel secrets are present."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          echo "Building application..."
          npm run build
          echo "✅ Build succeeded."
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Deploy to Vercel (production)
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying to Vercel..."
          npm install --global vercel@latest
          DEPLOY_URL=$(vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --org-id "$VERCEL_ORG_ID" \
            --project-id "$VERCEL_PROJECT_ID")
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed to Vercel: ${DEPLOY_URL}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post PR comment with deployment status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildOutcome = '${{ steps.build.outcome }}';
            const deployOutcome = '${{ steps.deploy.outcome }}';
            const deployUrl = '${{ steps.deploy.outputs.deploy_url }}';
            const success = buildOutcome === 'success' && deployOutcome === 'success';
            const statusIcon = success ? '✅' : '❌';
            const statusText = success
              ? '**Deployment succeeded** — the latest changes are live on Vercel.'
              : '**Deployment failed** — check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.';

            let body = `## 🚀 Vercel Deployment\n\n`;
            body += `| | |\n|---|---|\n`;
            body += `| **Branch** | \`${{ github.ref_name }}\` |\n`;
            body += `| **Commit** | \`${{ github.sha }}\` |\n`;
            if (deployUrl) {
              body += `| **Deploy URL** | ${deployUrl} |\n`;
            }
            body += `\n| Step | Result |\n|---|---|\n`;
            body += `| Build | ${buildOutcome} |\n`;
            body += `| Deploy | ${deployOutcome} |\n`;
            body += `\n${statusIcon} ${statusText}\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Report deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUILD_OUTCOME="${{ steps.build.outcome }}"
          DEPLOY_OUTCOME="${{ steps.deploy.outcome }}"
          DEPLOY_URL="${{ steps.deploy.outputs.deploy_url }}"
          {
            echo "## 🚀 Vercel Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Trigger** | \`${{ github.event_name }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            if [ -n "${DEPLOY_URL}" ]; then
              echo "| **Deploy URL** | ${DEPLOY_URL} |"
            fi
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Build | ${BUILD_OUTCOME} |"
            echo "| Deploy | ${DEPLOY_OUTCOME} |"
            echo ""
            if [ "${BUILD_OUTCOME}" = "success" ] && [ "${DEPLOY_OUTCOME}" = "success" ]; then
              echo "✅ **Deployment succeeded** — the latest changes are live on Vercel."
            else
              echo "❌ **Deployment failed** — check the logs above for details."
              echo ""
              echo "**Common fixes:**"
              echo "- Ensure \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, and \`VERCEL_PROJECT_ID\` secrets are set."
              echo "- Check that the Vercel project is linked to this repository."
              echo "- Review the Build step logs for compile errors."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
