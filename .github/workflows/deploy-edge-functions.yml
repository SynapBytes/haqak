name: Deploy Supabase Edge Functions

# Deploys send-otp and verify-otp Edge Functions on every push to main and on
# manual dispatch.  Only these two functions are deployed — never a blanket
# "deploy all" — so an unrelated function with a compile error cannot block the
# OTP endpoints from going live.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — Personal access token from https://app.supabase.com/account/tokens
#   SUPABASE_PROJECT_ID    — Project reference ID shown in the Supabase dashboard URL
#                            (e.g. "ebawkhmmebecxirksvog")
#
# One-time setup:
#   1. Visit https://app.supabase.com/account/tokens → "Generate new token"
#   2. Copy the token value
#   3. In GitHub: Settings → Secrets and variables → Actions → New repository secret
#      Name: SUPABASE_ACCESS_TOKEN   Value: <token>
#   4. Add another secret:
#      Name: SUPABASE_PROJECT_ID     Value: <your-project-ref>
#   5. After secrets are set, trigger this workflow manually via:
#      Actions → Deploy Supabase Edge Functions → Run workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            missing+=("SUPABASE_ACCESS_TOKEN")
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            missing+=("SUPABASE_PROJECT_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secret(s): ${missing[*]}"
            echo ""
            echo "Setup instructions:"
            echo "  1. Go to https://app.supabase.com/account/tokens"
            echo "     → Generate new token → copy the value"
            echo "  2. In GitHub: Settings → Secrets and variables → Actions"
            echo "     → New repository secret"
            echo "     Name:  SUPABASE_ACCESS_TOKEN"
            echo "     Value: <token from step 1>"
            echo "  3. Add a second secret:"
            echo "     Name:  SUPABASE_PROJECT_ID"
            echo "     Value: <your Supabase project ref, e.g. ebawkhmmebecxirksvog>"
            echo "  4. Re-run this workflow from the Actions tab."
            exit 1
          fi
          echo "✅ All required secrets are present."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify function source files exist
        shell: bash
        run: |
          set -euo pipefail
          missing_files=()
          for f in \
            supabase/functions/send-otp/index.ts \
            supabase/functions/verify-otp/index.ts; do
            if [ ! -f "$f" ]; then
              missing_files+=("$f")
            fi
          done
          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "::error::Missing function source file(s): ${missing_files[*]}"
            echo "Create the missing file(s) and push to main before re-running."
            exit 1
          fi
          echo "✅ Function source files found."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Deploy send-otp
        id: deploy_send_otp
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying send-otp..."
          supabase functions deploy send-otp --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ send-otp deployed."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy verify-otp
        id: deploy_verify_otp
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying verify-otp..."
          supabase functions deploy verify-otp --project-ref "$SUPABASE_PROJECT_ID"
          echo "✅ verify-otp deployed."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: List deployed functions
        id: list_functions
        shell: bash
        run: |
          set -euo pipefail
          echo "Listing deployed Edge Functions for project ${SUPABASE_PROJECT_ID}..."
          supabase functions list --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Smoke test — send-otp reachable
        id: smoke_send_otp
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          echo "Checking send-otp endpoint at ${PROJECT_URL}/functions/v1/send-otp ..."
          OPTIONS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://haqak.app" \
            -H "Access-Control-Request-Method: POST" \
            "${PROJECT_URL}/functions/v1/send-otp")
          POST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${PROJECT_URL}/functions/v1/send-otp")
          echo "  → OPTIONS HTTP status: $OPTIONS_STATUS"
          echo "  → POST HTTP status: $POST_STATUS"
          # CORS preflight returns 200 when function exists; 404 means not deployed
          if [ "$OPTIONS_STATUS" = "404" ] || [ "$POST_STATUS" = "404" ]; then
            echo "::error::send-otp returned 404 (OPTIONS=$OPTIONS_STATUS, POST=$POST_STATUS) — function may not have deployed correctly."
            exit 1
          fi
          if [ "$OPTIONS_STATUS" != "200" ]; then
            echo "::error::send-otp OPTIONS returned $OPTIONS_STATUS (expected 200)."
            exit 1
          fi
          echo "✅ send-otp is reachable (OPTIONS=$OPTIONS_STATUS, POST=$POST_STATUS)"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Smoke test — verify-otp reachable
        id: smoke_verify_otp
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          echo "Checking verify-otp endpoint at ${PROJECT_URL}/functions/v1/verify-otp ..."
          OPTIONS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://haqak.app" \
            -H "Access-Control-Request-Method: POST" \
            "${PROJECT_URL}/functions/v1/verify-otp")
          POST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${PROJECT_URL}/functions/v1/verify-otp")
          echo "  → OPTIONS HTTP status: $OPTIONS_STATUS"
          echo "  → POST HTTP status: $POST_STATUS"
          if [ "$OPTIONS_STATUS" = "404" ] || [ "$POST_STATUS" = "404" ]; then
            echo "::error::verify-otp returned 404 (OPTIONS=$OPTIONS_STATUS, POST=$POST_STATUS) — function may not have deployed correctly."
            exit 1
          fi
          if [ "$OPTIONS_STATUS" != "200" ]; then
            echo "::error::verify-otp OPTIONS returned $OPTIONS_STATUS (expected 200)."
            exit 1
          fi
          echo "✅ verify-otp is reachable (OPTIONS=$OPTIONS_STATUS, POST=$POST_STATUS)"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Report deployment status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          DEPLOY_SEND_OUTCOME="${{ steps.deploy_send_otp.outcome }}"
          DEPLOY_VERIFY_OUTCOME="${{ steps.deploy_verify_otp.outcome }}"
          SMOKE_SEND_OUTCOME="${{ steps.smoke_send_otp.outcome }}"
          SMOKE_VERIFY_OUTCOME="${{ steps.smoke_verify_otp.outcome }}"
          {
            echo "## 🚀 Edge Functions Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Trigger** | \`${{ github.event_name }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Deployed** | \`send-otp\`, \`verify-otp\` |"
            echo "| **Project URL** | ${PROJECT_URL} |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Deploy send-otp | ${DEPLOY_SEND_OUTCOME} |"
            echo "| Deploy verify-otp | ${DEPLOY_VERIFY_OUTCOME} |"
            echo "| Smoke test: send-otp | ${SMOKE_SEND_OUTCOME} |"
            echo "| Smoke test: verify-otp | ${SMOKE_VERIFY_OUTCOME} |"
            echo ""
            if [ "${DEPLOY_SEND_OUTCOME}" = "success" ] && \
               [ "${DEPLOY_VERIFY_OUTCOME}" = "success" ] && \
               [ "${SMOKE_SEND_OUTCOME}" = "success" ] && \
               [ "${SMOKE_VERIFY_OUTCOME}" = "success" ]; then
              echo "✅ **All steps passed** — functions are deployed and smoke tests passed."
            else
              echo "❌ **One or more steps failed** — check the logs above for details."
              echo ""
              echo "**Common fixes:**"
              echo "- Ensure \`SUPABASE_ACCESS_TOKEN\` and \`SUPABASE_PROJECT_ID\` secrets are set."
              echo "- See [DEPLOYMENT.md — Troubleshooting](docs/DEPLOYMENT.md#7-troubleshooting) for more help."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
