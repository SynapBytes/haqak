name: Deploy Supabase Edge Functions

# Deploys all Supabase Edge Functions on every push to main (no path filter,
# so a fresh project always gets all functions deployed) and on manual dispatch.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — Personal access token from https://app.supabase.com/account/tokens
#   SUPABASE_PROJECT_ID    — Project reference ID shown in the Supabase dashboard URL
#                            (e.g. "ebawkhmmebecxirksvog")
#
# One-time setup:
#   1. Visit https://app.supabase.com/account/tokens → "Generate new token"
#   2. Copy the token value
#   3. In GitHub: Settings → Secrets and variables → Actions → New repository secret
#      Name: SUPABASE_ACCESS_TOKEN   Value: <token>
#   4. Add another secret:
#      Name: SUPABASE_PROJECT_ID     Value: <your-project-ref>
#   5. After secrets are set, trigger this workflow manually via:
#      Actions → Deploy Supabase Edge Functions → Run workflow

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      function_name:
        description: "Function to deploy (leave blank to deploy all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            missing+=("SUPABASE_ACCESS_TOKEN")
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            missing+=("SUPABASE_PROJECT_ID")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secret(s): ${missing[*]}"
            echo ""
            echo "Setup instructions:"
            echo "  1. Go to https://app.supabase.com/account/tokens"
            echo "     → Generate new token → copy the value"
            echo "  2. In GitHub: Settings → Secrets and variables → Actions"
            echo "     → New repository secret"
            echo "     Name:  SUPABASE_ACCESS_TOKEN"
            echo "     Value: <token from step 1>"
            echo "  3. Add a second secret:"
            echo "     Name:  SUPABASE_PROJECT_ID"
            echo "     Value: <your Supabase project ref, e.g. ebawkhmmebecxirksvog>"
            echo "  4. Re-run this workflow from the Actions tab."
            exit 1
          fi
          echo "✅ All required secrets are present."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Deploy Edge Function(s)
        run: |
          FUNCTION="${{ github.event.inputs.function_name }}"
          if [ -n "$FUNCTION" ]; then
            echo "Deploying single function: $FUNCTION"
            supabase functions deploy "$FUNCTION" \
              --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "Deploying all Edge Functions..."
            supabase functions deploy \
              --project-ref "$SUPABASE_PROJECT_ID"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Smoke test — send-otp reachable
        run: |
          PROJECT_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          echo "Checking send-otp endpoint at ${PROJECT_URL}/functions/v1/send-otp ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://haqak.app" \
            -H "Access-Control-Request-Method: POST" \
            "${PROJECT_URL}/functions/v1/send-otp")
          echo "  → HTTP status: $HTTP_STATUS"
          # CORS preflight returns 200 when function exists; 404 means not deployed
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "::error::send-otp returned 404 — function may not have deployed correctly."
            exit 1
          fi
          echo "✅ send-otp is reachable (status $HTTP_STATUS)"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Smoke test — verify-otp reachable
        run: |
          PROJECT_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          echo "Checking verify-otp endpoint at ${PROJECT_URL}/functions/v1/verify-otp ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X OPTIONS \
            -H "Origin: https://haqak.app" \
            -H "Access-Control-Request-Method: POST" \
            "${PROJECT_URL}/functions/v1/verify-otp")
          echo "  → HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "404" ]; then
            echo "::error::verify-otp returned 404 — function may not have deployed correctly."
            exit 1
          fi
          echo "✅ verify-otp is reachable (status $HTTP_STATUS)"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
