name: Security - Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build gitleaks args
        id: gitleaks_args
        shell: bash
        run: |
          set -euo pipefail
          ARGS="--source . --redact --config=.gitleaks.toml"
          if [[ -f ".gitleaks.baseline.json" ]]; then
            ARGS="$ARGS --baseline-path=.gitleaks.baseline.json"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (fail on findings)
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect ${{ steps.gitleaks_args.outputs.args }}
