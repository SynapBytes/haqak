name: Security - Gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (fail on findings)
        run: |
          set -euo pipefail
          ARGS=(--source . --redact --config=.gitleaks.toml)
          if [[ -f ".gitleaks.baseline.json" ]]; then
            ARGS+=(--baseline-path=.gitleaks.baseline.json)
          fi
          gitleaks detect "${ARGS[@]}"
