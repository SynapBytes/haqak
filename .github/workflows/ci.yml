name: CI

on:
  push:
    branches: ["main", "copilot/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    name: Build, lint, test
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  dependency-audit-high:
    name: Dependency audit (high/critical)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (fail on high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Verify npm package signatures/provenance (non-blocking)
        run: npm audit signatures
        continue-on-error: true

  dependency-audit-weekly-report:
    name: Dependency audit report (weekly, medium/low)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (report medium/low, non-blocking)
        run: npm audit --omit=dev --audit-level=low
        continue-on-error: true

      - name: Verify npm package signatures/provenance (non-blocking)
        run: npm audit signatures
        continue-on-error: true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if any tracked .env file exists
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$'; then
            echo "Tracked .env* file detected. Remove it from the repository."
            exit 1
          fi

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks scan (working tree)
        if: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          ARGS=(--source . --redact --config=.gitleaks.toml)
          if [[ -f ".gitleaks.baseline.json" ]]; then
            ARGS+=(--baseline-path=.gitleaks.baseline.json)
          fi
          gitleaks detect "${ARGS[@]}"

      - name: Gitleaks scan (full history)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          ARGS=(--source . --redact --config=.gitleaks.toml --log-opts=--all)
          if [[ -f ".gitleaks.baseline.json" ]]; then
            ARGS+=(--baseline-path=.gitleaks.baseline.json)
          fi
          gitleaks detect "${ARGS[@]}"
